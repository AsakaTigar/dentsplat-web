name: Deploy DentSplat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` honours package-lock.json exactly; the app is a pure Vite build with no postinstall
      # step, so nothing here needs the GPU, a browser, or the Python pipeline.
      - run: npm ci
      - run: npm run build
      # A brand-new repository has Pages switched off, and `deploy-pages` fails outright in that state.
      # `enablement: true` turns it on with the workflow token, so the first push is self-sufficient --
      # no manual Settings -> Pages click, and no admin-scoped PAT needed for it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # `base: './'` in vite.config.ts is what makes the artefact work under /<repo>/; the app's asset
      # fetches go through import.meta.env.BASE_URL for the same reason.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
